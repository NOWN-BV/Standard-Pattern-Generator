  // low end and the high end (12 mm ... 45 mm ... 12 mm), so A|B matches but
  // A|A would not, and the tiles cannot be laid in an arbitrary order.
  //
  // They become freely interchangeable only when the driver completes a WHOLE
  // number of cycles across a panel, so the design returns to the same value at
  // both panel edges. Measured here rather than assumed: compare the emitted
  // hole sizes on the panel's left edge against its right edge, and likewise
  // top against bottom.
  const edgeProfile = (fixed, axis) => {
    const eps = 1e-6;
    return holes
      .filter((hh) => Math.abs((axis === 'x' ? hh.cx : hh.cy) - fixed) < eps)
      .sort((a, b) => (axis === 'x' ? a.cy - b.cy : a.cx - b.cx))
      .map((hh) => Math.round(hh.r * 2 * 1e4) / 1e4);
  };
  const profilesMatch = (a, b) =>
    a.length > 0 && a.length === b.length && a.every((v, i) => Math.abs(v - b[i]) < 1e-4);

  const xMatch =
    p.cols < 1 ? true : profilesMatch(edgeProfile(0, 'x'), edgeProfile(PANEL.moduleW, 'x'));
  const yMatch =
    p.rows < 1 ? true : profilesMatch(edgeProfile(0, 'y'), edgeProfile(PANEL.moduleH, 'y'));
  stats.edgeMatchX = xMatch;
  stats.edgeMatchY = yMatch;
  // Interchangeable = a tile can sit next to any other tile, in any order.
  stats.tilesInterchangeable = xMatch && yMatch;

  // -- DOES THE PATTERN CONTINUE ACROSS A JOINT? ----------------------------
  //
  // Distinct from the edge check above, and this is the distinction that
  // matters. Under P1/P4 the coordinate WRAPS, so a hole at x = 600 samples the
  // same point as one at x = 0: the two edge profiles are identical by
  // construction and that check can never fail. Identical edges only mean the
  // pattern RESTARTS cleanly - not that it CONTINUES.
  //
  // Tested directly: is the driver periodic on the module? Sample it at (x, y)
  // and again one module away, UNWRAPPED. If those differ, the field restarts
  // mid-cycle and shows a visible break at every seam. This is exact - an
  // earlier version compared size steps either side of a joint and let a
  // diagonal wave through whose jump happened to be small at the sampled rows.
  {
    const probe = (qx, qy) => clamp(modulate(qx, qy, p, f), 0, 1);
    let dx = 0;
    let dy = 0;
    for (let i = 0; i <= 12; i++) {
      for (let j = 0; j <= 12; j++) {
        const qx = (i / 12) * PANEL.moduleW;
        const qy = (j / 12) * PANEL.moduleH;
        dx = Math.max(dx, Math.abs(probe(qx, qy) - probe(qx + PANEL.moduleW, qy)));
        dy = Math.max(dy, Math.abs(probe(qx, qy) - probe(qx, qy + PANEL.moduleH)));
      }
    }
    stats.periodX = dx;
    stats.periodY = dy;
    // 1e-4 of a [0,1] field is well below one step of hole size, so a
    // hand-typed wavelength like 212.132 (the rounded exact value) still
    // counts as seamless; a genuine break is orders of magnitude larger.
    stats.patternContinuous = dx < 1e-4 && dy < 1e-4;
  }

  const faceArea = p.cols * p.rows * PANEL.faceW * PANEL.faceH;
  stats.cullAchieved = stats.candidates ? (stats.culled / stats.candidates) * 100 : 0;
  stats.openPct = faceArea ? (stats.openArea / faceArea) * 100 : 0;
  stats.holeMinDia = holes.length ? Math.min(...holes.map((h) => h.r)) * 2 : 0;
  stats.holeMaxDia = holes.length ? Math.max(...holes.map((h) => h.r)) * 2 : 0;

  return { params: p, ...f, panels, holes, stats };
}

/** Spreadsheet column letter - DXF_BUILDER.md section 4.4. */
/**
 * Tile the packed panel across the run. The pack is generated ONCE and
 * replayed, mirrored per the tile scheme, so a packed wall is still built from
 * 1 part (P1) or 4 (P4) - the same guarantee the lattice path gives.
 */
function buildPackedField(p, f, panels) {
  const pack = packPanel(p);
  const holes = [];
  const stats = { placed: 0, dropped: 0, shrunk: 0, culled: 0, openArea: 0, perPanel: {} };
  let id = 0;

  for (const pn of panels) {
    for (const c of pack) {
      // Mirror within the panel for P4, so B/C/D differ from A while every
      // edge still matches (the pack is periodic, so a mirror preserves that).
      const mirrorX = p.tiling === 'P4' && pn.col % 2 === 1;
      const mirrorY = p.tiling === 'P4' && pn.row % 2 === 1;
      const lx = mirrorX ? PANEL.moduleW - c.x : c.x;
      const ly = mirrorY ? PANEL.moduleH - c.y : c.y;
      const area = holeArea(p.shape, c.r, p.slotRatio);
      if (area < LIMITS.minPerfArea) {
        stats.dropped++;
        continue;
      }
      holes.push({
        id: id++,
        type: p.shape,
        cx: pn.x + lx,
        cy: pn.y + ly,
        r: c.r,
        area,
        panelCol: pn.col,
        panelRow: pn.row,
        localCx: lx - PANEL.perfInset,
        localCy: ly - PANEL.perfInset,
      });
      stats.placed++;
      stats.openArea += area;
      stats.perPanel[pn.label] = (stats.perPanel[pn.label] || 0) + 1;
    }
  }

  const faceArea = p.cols * p.rows * PANEL.moduleW * PANEL.moduleH;
  stats.openPct = faceArea ? (100 * stats.openArea) / faceArea : 0;
  const dias = holes.map((h) => h.r * 2);
  stats.holeMinDia = dias.length ? Math.min(...dias) : 0;
  stats.holeMaxDia = dias.length ? Math.max(...dias) : 0;
  // Periodic pack + mirror => every panel edge carries the same profile.
  stats.edgeMatchX = true;
  stats.edgeMatchY = true;
  stats.tilesInterchangeable = true;
  stats.cullFellBack = false;
  return { params: p, panels, holes, stats, fieldW: f.fieldW, fieldH: f.fieldH };
}

function colLetter(col) {
  let s = '';
  let n = col;
  for (;;) {
    s = String.fromCharCode(65 + (n % 26)) + s;
    if (n < 26) break;
    n = Math.floor(n / 26) - 1;
  }
  return s;
}

/** A1 = bottom-left. `row` is canvas-convention (0 = top). */
function panelLabel(col, row, rows) {
  return colLetter(col) + (rows - row);
}


// ===== shape-paths.js =====
// prototypes/veil-standard-pattern/shape-paths.js
// Shape tessellation, ported verbatim from DXF_BUILDER.md section 4.3 so the
// SVG preview and the exported DXF are the same geometry - not two
// approximations of it.
//
// Vertices are returned in the spec's Y-UP convention. The SVG helper flips
// about the hole centre, because SVG is Y-down. Do not "fix" the vert lists
// to be Y-down: they must stay byte-comparable with the DXF contract.

const TAU = Math.PI * 2;

/**
 * @param opts.ratio  slot length : width. 2.5 is the original fixed capsule.
 * @param opts.angle  rotation about the hole centre, radians, Y-up.
 *
 * Rotation lives HERE rather than in the renderer so the SVG preview and the
 * DXF polyline come from one vertex list - the whole reason this file exists.
 * A hole that looked rotated but exported straight would be worse than no
 * rotation at all.
 */
function shapeVerts(type, cx, cy, r, opts = {}) {
  const verts = [];
  switch (type) {
    case 'hex':
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3 - Math.PI / 6;
        verts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
      break;
    case 'diamond':
      verts.push([cx, cy + r], [cx + r * 0.7, cy], [cx, cy - r], [cx - r * 0.7, cy]);
      break;
    // A RHOMBUS WHOSE PROPORTION IS FREE.
    //
    // 'diamond' is a rhombus too, but at one fixed proportion, and existing
    // designs depend on that number - so this is a separate shape rather than
    // a parameter added to it. Long diagonal 2r along the shape's own axis,
    // short diagonal 2r/ratio across it: at ratio 1 that is a square standing
    // on its corner, and as the ratio climbs it shears down to a sliver
    // without the long diagonal ever moving. That is the one property the
    // pattern this was built for holds constant.
    case 'rhomb': {
      const q = Math.max(1, opts.ratio ?? 1);
      const hw = r / q;
      const k = Math.max(0.2, opts.curve ?? 1);
      if (Math.abs(k - 1) < 1e-9) {
        verts.push([cx, cy + r], [cx + hw, cy], [cx, cy - r], [cx - hw, cy]);
        break;
      }
      // SIDES CURVED, TIPS STILL SHARP.
      //
      // The superellipse |x/hw|^k + |y/r|^k = 1, walked in the ANGLE rather
      // than in x, so all four extreme points land exactly on the axes at any
      // k: the two ends stay points and only the sides between them bend.
      // k = 1 is the straight rhombus above, below 1 the sides pinch inward -
      // a playing-card diamond - and above 1 they bow out, reaching an ellipse
      // at 2. A Bezier drawn tip to tip would round the tips off as it bulged,
      // which is the one thing that must not move.
      const e = 2 / k;
      const RHOMB_SEGS = 32; // divisible by 4, so the extremes are hit exactly
      for (let i = 0; i < RHOMB_SEGS; i++) {
        const th = (i * TAU) / RHOMB_SEGS;
        const ct = Math.cos(th);
        const st = Math.sin(th);
        verts.push([
          cx + hw * Math.sign(ct) * Math.abs(ct) ** e,
          cy + r * Math.sign(st) * Math.abs(st) ** e,
        ]);
      }
      break;
    }
    case 'square': {
      const s = r * 0.8;
      verts.push([cx - s, cy + s], [cx + s, cy + s], [cx + s, cy - s], [cx - s, cy - s]);
      break;
    }
    case 'cross': {
      const cw = r * 0.35;
      const cl = r;
      verts.push(
        [cx - cw, cy + cl],
        [cx + cw, cy + cl],
        [cx + cw, cy + cw],
        [cx + cl, cy + cw],
        [cx + cl, cy - cw],
        [cx + cw, cy - cw],
        [cx + cw, cy - cl],
        [cx - cw, cy - cl],
        [cx - cw, cy - cw],
        [cx - cl, cy - cw],
        [cx - cl, cy + cw],
        [cx - cw, cy + cw]
      );
      break;
    }
    case 'triangle':
      verts.push([cx, cy + r], [cx + r * 0.87, cy - r * 0.5], [cx - r * 0.87, cy - r * 0.5]);
      break;
    case 'star':
      for (let i = 0; i < 5; i++) {
        const ao = (i * TAU) / 5 - Math.PI / 2;
        const ai = ao + Math.PI / 5;
        verts.push([cx + r * Math.cos(ao), cy + r * Math.sin(ao)]);
        verts.push([cx + r * 0.4 * Math.cos(ai), cy + r * 0.4 * Math.sin(ai)]);
      }
      break;
    case 'slot': {
      // Length is always 2r; the ratio sets how narrow it gets. A dash rather
      // than a lozenge needs about 6:1 and up.
      const ratio = Math.max(1.05, opts.ratio ?? 2.5);
      const slw = r / ratio;
      const sll = r;
      for (let i = 0; i <= 8; i++) {
        const a = Math.PI + (i * Math.PI) / 8;
        verts.push([cx + slw * Math.cos(a), cy - (sll - slw) + slw * Math.sin(a)]);
      }
      for (let i = 0; i <= 8; i++) {
        const a = (i * Math.PI) / 8;
        verts.push([cx + slw * Math.cos(a), cy + (sll - slw) + slw * Math.sin(a)]);
      }
      break;
    }
    case 'organic': {
      const seed = Math.abs(cx * 7.3 + cy * 13.1) % 100;
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        const rr = r * (0.65 + 0.35 * Math.sin(i * 2.7 + seed * 0.1));
        verts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
      }
      break;
    }
    default:
      break; // circle - emitted as a native primitive, no verts
  }
  const ang = opts.angle ?? 0;
  if (!ang || !verts.length) return verts;
  const ca = Math.cos(ang);
  const sa = Math.sin(ang);
  return verts.map(([vx, vy]) => {
    const dx = vx - cx;
    const dy = vy - cy;
    return [cx + dx * ca - dy * sa, cy + dx * sa + dy * ca];
  });
}

const fx = (n) => Number(n.toFixed(3));

/**
 * SVG path `d` for one hole, in field coords (Y down).
 * Circles return null - render them as <circle> so the DOM stays light.
 */
function svgPath(hole) {
  if (hole.type === 'circle') return null;
  const verts = shapeVerts(hole.type, hole.cx, hole.cy, hole.r, {
    angle: hole.angle,
    ratio: hole.ratio,
    curve: hole.curve,
  });
  if (!verts.length) return null;
  // Flip Y about the hole centre: spec verts are Y-up, SVG is Y-down.
  const d = verts
    .map(([vx, vy], i) => `${i ? 'L' : 'M'}${fx(vx)} ${fx(hole.cy - (vy - hole.cy))}`)
    .join(' ');
  return `${d} Z`;
}

// ===== exporters.js =====
// prototypes/veil-standard-pattern/exporters.js
// SVG / DXF / payload writers for the standard-pattern generator.
//
// The DXF writer follows DXF_BUILDER.md sections 2-5 exactly: three layers
// (Panel_Boundary, THRU_CUT_PATTERN, PANEL_LABELS), AC1009 / R12, millimetres,
// Y-up, A1 = bottom-left, true colour on every perforation entity.
//
// In production the server owns DXF generation (the browser never emits cut
// files - see CLAUDE.md "Architecture context"). This client-side writer
// exists so the prototype is self-contained and reviewable; when this lands in
// the app, swap `downloadDXF` for a POST of `toPayload()` to the output
// registry and keep only the SVG preview here.


const f3 = (n) => Number(n).toFixed(3);

// ---------------------------------------------------------------- SVG ------

/** Standalone SVG of the field, in millimetres. */
/**
 * Every hole a panel has to cut, in panel-local mm.
 *
 * NOT the same as "holes whose panelCol/panelRow is this panel". A hole centred
 * exactly on a joint is shared: it sits half in each neighbour, and BOTH have to
 * cut their half. The owner test in buildField assigns such a hole to one panel
 * only (first match wins), which is right for counting and for the continuous
 * preview - but nesting from it drops the whole boundary column from the
 * neighbour, leaving a bare strip down one edge of every panel in the DXF.
 *
 * So this selects by GEOMETRY: any hole whose centre lies within the panel
 * module, edges inclusive. Shared holes appear in both sheets, which is what the
 * cutter needs.
 */
function panelHoles(field, pn) {
  const e = 1e-6;
  const out = [];
  for (const h of field.holes) {
    if (h.cx < pn.x - e || h.cx > pn.x + PANEL.moduleW + e) continue;
    if (h.cy < pn.y - e || h.cy > pn.y + PANEL.moduleH + e) continue;
    out.push({ h, lx: h.cx - pn.x, ly: h.cy - pn.y });
  }
  return out;
}

function toSVG(field, opts = {}) {
  const { holeFill = '#111111', panelStroke = '#c9ccd1', showPanels = true } = opts;
  const parts = [];
  parts.push(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${f3(field.fieldW)}mm" height="${f3(
      field.fieldH
    )}mm" viewBox="0 0 ${f3(field.fieldW)} ${f3(field.fieldH)}">`
  );
  parts.push(`<rect width="${f3(field.fieldW)}" height="${f3(field.fieldH)}" fill="none"/>`);

  if (showPanels) {
    parts.push(`<g fill="none" stroke="${panelStroke}" stroke-width="1.5">`);
    for (const pn of field.panels) {
      parts.push(
        `<rect x="${f3(pn.x)}" y="${f3(pn.y)}" width="${f3(pn.w)}" height="${f3(pn.h)}"/>`
      );
    }
    parts.push('</g>');
  }

  parts.push(`<g fill="${holeFill}">`);
  for (const h of field.holes) {
    const d = svgPath(h);
    parts.push(
      d ? `<path d="${d}"/>` : `<circle cx="${f3(h.cx)}" cy="${f3(h.cy)}" r="${f3(h.r)}"/>`
    );
  }
  parts.push('</g></svg>');
  return parts.join('\n');
}

  const v = String(hex).replace('#', '');
  const r = parseInt(v.slice(0, 2), 16) || 0;
  const g = parseInt(v.slice(2, 4), 16) || 0;
  const b = parseInt(v.slice(4, 6), 16) || 0;
  return r * 65536 + g * 256 + b;
};

    // whatever the part was drawn with. They are declared here so the file
    // opens with them intact rather than collapsed onto layer 0.

// ----------------------------------------------------- panel geometry ------
//
// DXF_BUILDER.md always said the cut and bend layers "live in the separate
// panel-geometry DXFs and are merged by a later stage". This is that stage:
// the flat pattern of the real part - its outer profile, its interior
// cutouts, its bend lines - carried into the same file as the perforation,
// instead of a 600 x 1200 rectangle standing in for a panel that actually has
// returns and notches.
//
// The file is read, not trusted. Only the entity types R12 can express are
// carried over, and whatever is left is COUNTED AND REPORTED rather than
// dropped quietly: a cut file silently missing a profile is the one failure
// this must not have.

/** (code, value) pairs, which is all a DXF is. */
function dxfPairs(text) {
  const t = String(text).split(/\r?\n/);
  const out = [];
  for (let i = 0; i + 1 < t.length; i += 2) out.push([t[i].trim(), t[i + 1]]);
  return out;
}

/**
 * Entities from a panel-geometry DXF, in a normal form the writer below can
 * emit. LWPOLYLINE is folded into POLYLINE because R12 has no LWPOLYLINE, and
 * an old POLYLINE / VERTEX / SEQEND run is regrouped into one entity. Bulges
 * ride along on the vertex, so an arc inside a profile survives the trip.
 */
function parsePanelGeo(text, opts = {}) {
  const p = dxfPairs(text);
  // WHAT THE FILE SAYS ITS OWN DRAWING IS.
  //
  // $EXTMIN / $EXTMAX are the extents the CAD app last computed. A file can
  // carry stray geometry outside them - a mirrored construction copy left in
  // model space, say - and merging that would stamp it onto every panel, tens
  // of metres away, silently wrecking the sheet. So they are read, compared,
  // and any disagreement is REPORTED. Dropping only happens when asked.
  let headerBbox = null;
  {
    const at = (name) => {
      for (let i = 0; i < p.length; i++)
        if (p[i][0] === '9' && p[i][1].trim() === name) {
          const g = (code) => {
            for (let k = i + 1; k < Math.min(i + 8, p.length); k++)
              if (p[k][0] === code) return Number(p[k][1]);
            return NaN;
          };
          return { x: g('10'), y: g('20') };
        }
      return null;
    };
    const lo = at('$EXTMIN');
    const hi = at('$EXTMAX');
    if (lo && hi && Number.isFinite(lo.x) && Number.isFinite(hi.x) && hi.x > lo.x)
      headerBbox = { minX: lo.x, minY: lo.y, maxX: hi.x, maxY: hi.y };
  }
  const out = [];
  const skipped = {};
  const layers = new Set();
  const num = (v) => Number(v);
  let sec = null;
  let i = 0;
  while (i < p.length) {
    const [c, v] = p[i];
    if (c === '0' && v === 'SECTION') {
      sec = p[i + 1] && p[i + 1][0] === '2' ? p[i + 1][1] : null;
      i += 2;
      continue;
    }
    if (c === '0' && v === 'ENDSEC') {
      sec = null;
      i += 1;
      continue;
    }
    if (sec !== 'ENTITIES' || c !== '0') {
      i += 1;
      continue;
    }
    const type = v;
    const codes = [];
    let j = i + 1;
    for (; j < p.length && p[j][0] !== '0'; j++) codes.push(p[j]);
    const get = (k) => {
      const f = codes.find((e) => e[0] === k);
      return f ? f[1] : undefined;
    };
    const layer = get('8') ?? '0';
    // EXTRUSION DIRECTION - the coordinates may not be world coordinates.
    //
    // A 2D entity is defined in its own plane, and code 210/220/230 says which
    // way that plane faces. CAD writes (0,0,-1) for anything drawn on a
    // mirrored plane, and its x is then measured the other way: world x is
    // -x. Ignoring this put 55 entities of a real part at +1258 instead of
    // -1258 - far outside the drawing, where they looked exactly like a stray
    // mirrored copy someone had left behind. They were not stray. They were
    // the part, read wrongly, and they were being dropped from the cut file.
    const ez = Number(get('230') ?? 1);
    const exX = Number(get('210') ?? 0);
    const exY = Number(get('220') ?? 0);
    const mirrored = ez < 0 && Math.abs(exX) < 1e-9 && Math.abs(exY) < 1e-9;
    // A plane at some arbitrary angle needs the full arbitrary-axis algorithm.
    // Nothing here has produced one, and guessing would silently misplace
    // geometry, so it is reported instead.
    if ((Math.abs(exX) > 1e-9 || Math.abs(exY) > 1e-9) && type !== 'SEQEND' && type !== 'VERTEX')
      skipped['oblique ' + type] = (skipped['oblique ' + type] ?? 0) + 1;
    const fx = mirrored ? (v) => -v : (v) => v;
    if (type === 'LINE') {
      layers.add(layer);
      out.push({
        kind: 'line',
        layer,
        x1: fx(num(get('10'))),
        y1: num(get('20')),
        x2: fx(num(get('11'))),
        y2: num(get('21')),
      });
      i = j;
    } else if (type === 'CIRCLE') {
      layers.add(layer);
      out.push({ kind: 'circle', layer, cx: fx(num(get('10'))), cy: num(get('20')), r: num(get('40')) });
      i = j;
    } else if (type === 'ARC') {
      layers.add(layer);
      out.push({
        kind: 'arc',
        layer,
        cx: fx(num(get('10'))),
        cy: num(get('20')),
        r: num(get('40')),
        // Under x -> -x every angle becomes 180 - angle, which reverses the
        // direction of travel, so the ends swap as well.
        a1: mirrored ? 180 - num(get('51')) : num(get('50')),
        a2: mirrored ? 180 - num(get('50')) : num(get('51')),
      });
      i = j;
    } else if (type === 'LWPOLYLINE') {
      layers.add(layer);
      // 10 / 20 alternate per vertex; a 42 belongs to the vertex it follows.
      const verts = [];
      let vx = null;
      for (const [cc, vv] of codes) {
        if (cc === '10') {
          if (vx) verts.push(vx);
          vx = [fx(num(vv)), 0, 0];
        } else if (cc === '20' && vx) vx[1] = num(vv);
        else if (cc === '42' && vx) vx[2] = num(vv);
      }
      if (vx) verts.push(vx);
      out.push({ kind: 'poly', layer, verts, closed: (Number(get('70')) | 0) & 1 });
      i = j;
    } else if (type === 'POLYLINE') {
      layers.add(layer);
      const closed = (Number(get('70')) | 0) & 1;
      const verts = [];
      let k = j;
      while (k < p.length && p[k][0] === '0' && p[k][1] === 'VERTEX') {
        const vc = [];
        let m = k + 1;
        for (; m < p.length && p[m][0] !== '0'; m++) vc.push(p[m]);
        const vg = (kk) => {
          const f = vc.find((e) => e[0] === kk);
          return f ? num(f[1]) : 0;
        };
        verts.push([fx(vg('10')), vg('20'), mirrored ? -vg('42') : vg('42')]);
        k = m;
      }
      if (k < p.length && p[k][0] === '0' && p[k][1] === 'SEQEND') {
        let m = k + 1;
        for (; m < p.length && p[m][0] !== '0'; m++);
        k = m;
      }
      out.push({ kind: 'poly', layer, verts, closed });
      i = k;
    } else {
      // Anything R12 cannot hold: SPLINE, ELLIPSE, INSERT, HATCH, 3D solids.
      if (type !== 'SEQEND' && type !== 'VERTEX') skipped[type] = (skipped[type] ?? 0) + 1;
      i = j;
    }
  }
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  const see = (x, y) => {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  };
  // AN ARC IS NOT ITS CIRCLE.
  //
  // Taking the full circle for an arc looks harmless until a file contains one
  // shallow arc of a large radius - a slightly crowned edge, say - and the
  // bounding box jumps to a hundred metres, which then throws every bbox and
  // centred alignment completely off. Only the swept part counts: the two
  // endpoints, plus whichever of the four cardinal points the sweep passes.
  const arcSee = (e) => arcSee2(e, see);
  for (const e of out) {
    if (e.kind === 'line') {
      see(e.x1, e.y1);
      see(e.x2, e.y2);
    } else if (e.kind === 'poly') {
      for (const vv of e.verts) see(vv[0], vv[1]);
    } else if (e.kind === 'arc') {
      arcSee(e);
    } else {
      see(e.cx - e.r, e.cy - e.r);
      see(e.cx + e.r, e.cy + e.r);
    }
  }
  // Anything living wholly outside the file's declared extents is stray.
  let outside = 0;
  let kept = out;
  if (headerBbox) {
    const pad = 1e-6;
    const inside = (e) => {
      let a = Infinity;
      let b = -Infinity;
      let c = Infinity;
      let d = -Infinity;
      const s = (x, y) => {
        if (x < a) a = x;
        if (x > b) b = x;
        if (y < c) c = y;
        if (y > d) d = y;
      };
      if (e.kind === 'line') {
        s(e.x1, e.y1);
        s(e.x2, e.y2);
      } else if (e.kind === 'poly') {
        for (const vv of e.verts) s(vv[0], vv[1]);
      } else if (e.kind === 'arc') {
        arcSee2(e, s);
      } else {
        s(e.cx - e.r, e.cy - e.r);
        s(e.cx + e.r, e.cy + e.r);
      }
      return (
        b >= headerBbox.minX - pad &&
        a <= headerBbox.maxX + pad &&
        d >= headerBbox.minY - pad &&
        c <= headerBbox.maxY + pad
      );
    };
    const within = out.filter(inside);
    outside = out.length - within.length;
    if (outside && opts.dropOutside) kept = within;
  }
  if (kept !== out) {
    minX = Infinity;
    minY = Infinity;
    maxX = -Infinity;
    maxY = -Infinity;
    for (const e of kept) {
      if (e.kind === 'line') {
        see(e.x1, e.y1);
        see(e.x2, e.y2);
      } else if (e.kind === 'poly') {
        for (const vv of e.verts) see(vv[0], vv[1]);
      } else if (e.kind === 'arc') {
        arcSee(e);
      } else {
        see(e.cx - e.r, e.cy - e.r);
        see(e.cx + e.r, e.cy + e.r);
      }
    }
  }
  const usedLayers = new Set(kept.map((e) => e.layer));
  return {
    entities: kept,
    layers: [...layers].filter((n) => usedLayers.has(n)),
    skipped,
    headerBbox,
    outside,
    bbox: kept.length ? { minX, minY, maxX, maxY } : null,
  };
}

/** The swept extent of an arc, reported through a caller's `see`. */
function arcSee2(e, see) {
  const rad = (d) => (d * Math.PI) / 180;
  const norm = (d) => ((d % 360) + 360) % 360;
  const a1 = norm(e.a1);
  const a2 = norm(e.a2);
  const span = norm(a2 - a1) || (e.a1 === e.a2 ? 0 : 360);
  see(e.cx + e.r * Math.cos(rad(a1)), e.cy + e.r * Math.sin(rad(a1)));
  see(e.cx + e.r * Math.cos(rad(a2)), e.cy + e.r * Math.sin(rad(a2)));
  for (const c of [0, 90, 180, 270])
    if (norm(c - a1) <= span) see(e.cx + e.r * Math.cos(rad(c)), e.cy + e.r * Math.sin(rad(c)));
}

/**
 * Where the geometry's own origin lands inside the panel's box.
 *   'origin' - as drawn, which is what a file prepared on the module's own
 *              frame needs, and the only one that cannot silently disguise a
 *              file drawn at the wrong scale.
 *   'bbox'   - its bounding box's lower-left onto the panel's lower-left.
 *   'center' - its bounding box centred on the panel.
 * `dx` / `dy` shift it further, in mm, after whichever applied.
 */
function panelGeoOffset(geo, align = 'origin', dx = 0, dy = 0) {
  const b = geo.bbox;
  if (!b || align === 'origin') return { ox: dx, oy: dy };
  if (align === 'bbox') return { ox: dx - b.minX, oy: dy - b.minY };
  return {
    ox: dx + (PANEL.moduleW - (b.maxX - b.minX)) / 2 - b.minX,
    oy: dy + (PANEL.moduleH - (b.maxY - b.minY)) / 2 - b.minY,
  };
}

/** One panel's worth of that geometry, translated, as R12 entity codes. */
function panelGeoCodes(geo, ox, oy) {
  const out = [];
  for (const e of geo.entities) {
    if (e.kind === 'line') {
      out.push(
        '0', 'LINE', '8', e.layer,
        '10', f3(e.x1 + ox), '20', f3(e.y1 + oy), '30', '0.0',
        '11', f3(e.x2 + ox), '21', f3(e.y2 + oy), '31', '0.0'
      );
    } else if (e.kind === 'circle') {
      out.push(
        '0', 'CIRCLE', '8', e.layer,
        '10', f3(e.cx + ox), '20', f3(e.cy + oy), '30', '0.0',
        '40', f3(e.r)
      );
    } else if (e.kind === 'arc') {
      out.push(
        '0', 'ARC', '8', e.layer,
        '10', f3(e.cx + ox), '20', f3(e.cy + oy), '30', '0.0',
        '40', f3(e.r), '50', f3(e.a1), '51', f3(e.a2)
      );
    } else {
      out.push('0', 'POLYLINE', '8', e.layer, '66', '1', '70', e.closed ? '1' : '0',
        '10', '0.0', '20', '0.0', '30', '0.0');
      for (const vv of e.verts) {
        out.push('0', 'VERTEX', '8', e.layer,
          '10', f3(vv[0] + ox), '20', f3(vv[1] + oy), '30', '0.0');
        if (vv[2]) out.push('42', f3(vv[2]));
      }
      out.push('0', 'SEQEND', '8', e.layer);
    }
  }
  return out;
}

function polyline(layer, verts, colorInt) {
  const out = ['0', 'POLYLINE', '8', layer];
  if (colorInt != null) out.push('420', String(colorInt));
  out.push('66', '1', '70', '1', '10', '0.0', '20', '0.0', '30', '0.0');
  for (const [vx, vy] of verts) {
    out.push('0', 'VERTEX', '8', layer);
    if (colorInt != null) out.push('420', String(colorInt));
    out.push('10', f3(vx), '20', f3(vy), '30', '0.0');
  }
  out.push('0', 'SEQEND', '8', layer);
  return out;
}

/**
 * R12 DXF for the field. `meta` supplies the RAL + backer strings that go
 * into PANEL_LABELS; defaults are obviously-placeholder on purpose so an
 * un-configured export cannot be mistaken for a real release.
 */
function toDXF(field, meta = {}) {
  const ral = meta.ral || { code: '9016', name: 'Traffic White', hex: '#F1F0EA' };
  const backer = meta.backer || 'aSoft None';
  const colorInt = hexToColorInt(ral.hex);
  // The real part, if one was supplied, under the perforation.
  const pg = meta.panelGeo;
  const geo = pg && pg.dxf ? parsePanelGeo(pg.dxf, { dropOutside: pg.dropOutside !== false }) : null;
  const geoOff = geo ? panelGeoOffset(geo, pg.align, pg.dx ?? 0, pg.dy ?? 0) : null;

  const { cols, rows } = field.params;
  const PW = PANEL.moduleW;
  const PH = PANEL.moduleH;
  const SX = PW + PANEL.exportGap;
  const SY = PH + PANEL.exportGap;

  const ents = [];
  for (const pn of field.panels) {
    const bx = pn.col * SX;
    const by = (rows - 1 - pn.row) * SY;
    // The boundary rectangle is a reference, not a cutter, so it stays even
    // when real geometry is present - unless told to stand down, which is what
    // a file that already draws its own outline wants.
    if (!geo || pg.keepBoundary !== false)
      ents.push(
        ...polyline('Panel_Boundary', [
          [bx, by],
          [bx + PW, by],
          [bx + PW, by + PH],
          [bx, by + PH],
        ])
      );
    if (geo) ents.push(...panelGeoCodes(geo, bx + geoOff.ox, by + geoOff.oy));
    const label = `${colLetter(pn.col)}${rows - pn.row}  |  RAL ${ral.code} ${ral.name}  |  ${backer}`;
    const tx = bx + PW / 2;
    const ty = by + PH / 2;
    ents.push(
      '0',
      'TEXT',
      '8',
      'PANEL_LABELS',
      '10',
      f3(tx),
      '20',
      f3(ty),
      '30',
      '0.0',
      '40',
      '30.0',
      '1',
      label,
      '72',
      '1',
      '73',
      '2',
      '11',
      f3(tx),
      '21',
      f3(ty),
      '31',
      '0.0',
      '7',
      'Standard'
    );
  }

  // Walk PANELS, not holes: a shared boundary hole has to be emitted once per
  // panel that touches it, which a per-hole loop keyed on its owner cannot do.
  const nested = [];
  for (const pn of field.panels) {
    for (const e of panelHoles(field, pn)) {
      nested.push({ h: e.h, col: pn.col, row: pn.row, lx: e.lx, ly: e.ly });
    }
  }
  for (const item of nested) {
    const h = item.h;
    const bx = item.col * SX;
    const by = (rows - 1 - item.row) * SY;
    const wx = bx + item.lx;
    const wy = by + PH - item.ly;
    if (h.type === 'circle') {
      ents.push(
        '0',
        'CIRCLE',
        '8',
        'THRU_CUT_PATTERN',
        '420',
        String(colorInt),
        '10',
        f3(wx),
        '20',
        f3(wy),
        '30',
        '0.0',
        '40',
        f3(h.r)
      );
    } else {
      ents.push(
        ...polyline(
          'THRU_CUT_PATTERN',
          shapeVerts(h.type, wx, wy, h.r, { angle: h.angle, ratio: h.ratio, curve: h.curve }),
          colorInt
        )
      );
    }
  }

  const maxX = (cols - 1) * SX + PW;
  const maxY = (rows - 1) * SY + PH;
  const lines = [
    ...dxfHeader(maxX, maxY),
    ...dxfTables(geo ? geo.layers.filter((n) => !STD_LAYERS.has(n)) : []),
    '0',
    'SECTION',
    '2',
    'ENTITIES',
    ...ents,
    '0',
    'ENDSEC',
    '0',
    'EOF',
  ];
  return lines.join('\r\n') + '\r\n';
}

// ------------------------------------------------------------ payload ------

/** Lattice family -> the payload's 4-value patternType enum. */
const PATTERN_TYPE = {
  grid: 'grid',
  diagonal: 'grid',
  stagger: 'stagger',
  brick: 'stagger',
  hex: 'hex',
};

/**
 * `veil.spectral.v1` payload - the same contract the image-driven
 * configurator posts, so the existing server output registry can generate
 * DXF / PDF / PNG from a standard pattern with no backend change.
 *
 * The standard-pattern recipe (lattice family, modulation, seed...) has no
 * home in that schema, so it ships as a SEPARATE file from `toRecipe()`
 * rather than as extra keys here - the schema may be strict, and a rejected
 * payload is worse than a second file.
 */
function toPayload(field, meta = {}) {
  const p = field.params;
  return {
    schema: 'veil.spectral.v1',
    timestamp: meta.timestamp || new Date().toISOString(),
    designId: meta.designId || 'VEIL-SP-0001',
    designLabel: meta.designLabel || `Standard pattern ${p.lattice}/${p.modulation}`,
    openness: Number(field.stats.openPct.toFixed(2)),
    unitSystem: 'metric',
    pattern: {
      name: meta.presetName || 'Standard pattern',
      version: '1',
      id: meta.presetId || 'STD',
      shape: p.shape,
      pitch: p.pitch,
      minHole: Math.max(1, field.stats.holeMinDia || p.minDia),
      maxHole: Math.max(1, field.stats.holeMaxDia || p.maxDia),
      patternType: PATTERN_TYPE[p.lattice] || 'grid',
      mapping: 'linear',
      threshold: 128,
      rotation: p.latticeAngle,
      invertImg: !!p.invert,
    },
    grid: { cols: p.cols, rows: p.rows },
    panel: {
      width: PANEL.moduleW,
      height: PANEL.moduleH,
      gap: PANEL.exportGap,
      innerW: PANEL.faceW,
      innerH: PANEL.faceH,
      perfLocalOffset: PANEL.perfInset,
    },
    ral: meta.ral || { code: '9016', name: 'Traffic White', hex: '#F1F0EA' },
    asoft: meta.asoft || { role: 'none', name: 'None' },
    field: {
      fieldW: field.fieldW,
      fieldH: field.fieldH,
      totalOpenArea: field.stats.openArea,
      rotation: p.latticeAngle,
    },
    shapes: field.holes.map((h) => ({
      id: h.id,
      type: h.type,
      cx: Number(h.cx.toFixed(4)),
      cy: Number(h.cy.toFixed(4)),
      r: Number(h.r.toFixed(4)),
      area: Number(h.area.toFixed(4)),
      panelRow: h.panelRow,
      panelCol: h.panelCol,
      localCx: Number(h.localCx.toFixed(4)),
      localCy: Number(h.localCy.toFixed(4)),
    })),
  };
}

/** The generator recipe - reproduces the field exactly from parameters. */
function toRecipe(field, meta = {}) {
  return {
    schema: 'veil.standard-pattern.v1',
    presetId: meta.presetId || null,
    presetName: meta.presetName || null,
    params: field.params,
    derived: {
      fieldW: field.fieldW,
      fieldH: field.fieldH,
      holes: field.stats.placed,
      openPct: Number(field.stats.openPct.toFixed(3)),
      dropped: field.stats.dropped,
      shrunk: field.stats.shrunk,
    },
  };
}

// --------------------------------------------------------- downloads ------

/**
 * Save through the local harness server when there is one, and only fall back
 * to the browser's own download otherwise.
 *
 * Measured on the machine this was built for: the blob is created, the anchor
 * is in the document, the click fires, nothing throws - and the file still
 * lands as a GUID `.tmp` with the download name thrown away. Whatever sits
 * between the browser and the disk here is not reachable from page script, so
 * the dependable path is to hand the bytes to the server that is already
 * running and let it write the file. Returns where it went, or null when it
 * fell back.
 */
async function saveOut(filename, text, mime = 'text/plain') {
  try {
    const res = await fetch('/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: filename, text }),
    });
    if (res.ok) {
      const j = await res.json();
      if (j && j.ok) return j.path;
    }
  } catch {
    // no harness server - fall through to the browser
  }
  download(filename, text, mime);
  return null;
}

function download(filename, text, mime = 'text/plain') {
  const blob = new Blob([text], { type: `${mime};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  // IN THE DOCUMENT, AND REVOKED LATE.
  //
  // A detached anchor is ignored outright by some browsers, and revoking the
  // blob URL on the next line RACES the download: at that point the browser has
  // only been asked to save, it has not read the blob yet. Small files usually
  // win that race, which is why this looked fine for a preview SVG and then
  // silently produced nothing for a multi-megabyte DXF - the one case that
  // actually matters here.
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    a.remove();
    URL.revokeObjectURL(url);
  }, 30000);
}

/** PNG via an offscreen canvas render of the SVG. */
async function downloadPNG(field, filename, scalePxPerMm = 0.5) {
  const svg = toSVG(field, { showPanels: false });
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = rej;
    img.src = url;
  });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(field.fieldW * scalePxPerMm);
  canvas.height = Math.round(field.fieldH * scalePxPerMm);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(url);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElementNS(
    tag === 'svg' ||
      tag === 'g' ||
      tag === 'rect' ||
      tag === 'circle' ||
      tag === 'path' ||
      tag === 'text'
      ? 'http://www.w3.org/2000/svg'
      : 'http://www.w3.org/1999/xhtml',
    tag
  );
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.setAttribute('class', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) n.append(kid);
  return n;
};

function setValue(key, raw) {
  if (key === 'presetId') {
    state.presetId = raw;
    const preset = PRESETS.find((p) => p.id === raw);
    if (preset)
      Object.assign(
        state,
        DEFAULTS,
        { cols: state.cols, rows: state.rows, gap: state.gap },
        preset.params
      );
    render();
    return;
  }
  state[key] = raw;
  if (key === 'minDia') state.maxDia = Math.max(state.maxDia, raw);
  if (key === 'maxDia') state.minDia = Math.min(state.minDia, raw);
  if (
    !['showGhost', 'showFrames', 'showSeams', 'zoom', 'holeColor', 'panelColor'].includes(key)
  )
    state.presetId = '';
  render();
}

/**
 * Which controls are currently visible, as a string.
 *
 * The rail only needs rebuilding when this changes - i.e. when a `when`
 * condition opens or closes a control. Rebuilding on every value change
 * destroys and recreates the very element being dragged, which cancels the
 * gesture: a native colour picker closes the instant you click, and a slider
 * drag drops after the first move. See render().
 */
function railSignature() {
  const out = [];
  for (const item of SPEC) {
    if (item.group) {
      out.push("g:" + item.group);
      continue;
    }
    if (item.when && !item.when(state)) continue;
    out.push(item.key);
  }
  return out.join("|");
}

/** Refresh the readouts in place, without replacing any element. */
function syncRail() {
  for (const row of document.querySelectorAll(".row")) {
    const num = row.querySelector("input.val");
    const rng = row.querySelector("input[type=range]");
    if (!num || !rng) continue;
    if (document.activeElement !== num) num.value = rng.value;
  }
}

function buildRail() {
  const rail = document.getElementById('rail');
  rail.textContent = '';
  for (const item of SPEC) {
    if (item.group) {
      rail.append(el('div', { class: 'grp' }, item.group));
      continue;
    }
    if (item.when && !item.when(state)) continue;
    const value = state[item.key];
    const row = el('label', { class: 'row' });
    if (TIPS[item.key]) row.dataset.tip = TIPS[item.key];

    if (item.kind === 'color') {
      const inp = el('input', { type: 'color', class: 'swatch' });
      inp.value = String(value || '#000000');
      inp.addEventListener('input', () => setValue(item.key, inp.value));
      row.append(el('span', { class: 'lab' }, item.label), inp);
      rail.append(row);
      continue;
    }
    if (item.kind === 'file') {
      // SAMPLE ONCE, STORE THE GRID.
      //
      // The design keeps the luminance grid, not a path: designs.json has to
      // reopen identically on another machine, and a recipe that points at a
      // file somewhere on a desktop is not a recipe. The grid is capped on its
      // long side because a wall never resolves more than a few hundred holes
      // across, so a bigger picture only inflates the saved file.
      const CAP = 320;
      const inp = el('input', { type: 'file', accept: 'image/*' });
      const info = el('span', { class: 'lab' }, state.imageW ? state.imageW + ' x ' + state.imageH : 'none');
      inp.addEventListener('change', () => {
        const file = inp.files && inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, CAP / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const cv = document.createElement('canvas');
            cv.width = w;
            cv.height = h;
            const cx = cv.getContext('2d');
            cx.drawImage(img, 0, 0, w, h);
            const px = cx.getImageData(0, 0, w, h).data;
            const lum = new Uint8Array(w * h);
            for (let i = 0, j = 0; i < px.length; i += 4, j++) {
              // Rec. 601 luma - the same weighting a greyscale conversion uses,
              // so what the eye reads as dark in the picture is what closes up.
              lum[j] = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) | 0;
            }
            let s = '';
            for (let i = 0; i < lum.length; i += 8192)
              s += String.fromCharCode.apply(null, lum.subarray(i, i + 8192));
            state.imageW = w;
            state.imageH = h;
            state.imageLum = btoa(s);
            render();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      row.append(el('span', { class: 'lab' }, item.label), inp, info);
      rail.append(row);
      continue;
    }
    if (item.kind === 'check') {
      const box = el('input', { type: 'checkbox' });
      box.checked = !!value;
      box.addEventListener('change', () => setValue(item.key, box.checked));
      row.append(el('span', { class: 'lab' }, item.label), box);
    } else if (item.kind === 'select') {
      const sel = el('select');
      for (const opt of item.options()) {
        const o = el('option', { value: opt }, item.labels ? item.labels(opt) : opt);
        if (opt === value) o.setAttribute('selected', 'selected');
        sel.append(o);
      }
      sel.addEventListener('change', () => setValue(item.key, sel.value));
      row.append(el('span', { class: 'lab' }, item.label), sel);
    } else {
      // Typable value + slider, mirroring spectRAL sh/trk pairing: the number
      // is an editable input, not a readout, so an exact value can be entered
      // instead of hunted for with the slider.
      const out = el('input', {
        type: 'number',
        class: 'val',
        min: item.min,
        max: item.max,
        step: item.step,
        value,
        inputmode: 'decimal',
      });
      const inp = el('input', {
        type: 'range',
        min: item.min,
        max: item.max,
        step: item.step,
        value,
      });
      // Slider drives the number; committing the number drives the slider.
      inp.addEventListener('input', () => {
        out.value = inp.value;
        setValue(item.key, parseFloat(inp.value));
      });
      const commit = () => {
        const v = parseFloat(out.value);
        if (!Number.isFinite(v)) {
          out.value = String(state[item.key]);
          return;
        }
        // Clamp to the control range, then re-sync both halves so a typed
        // out-of-range value shows what was actually applied.
        const clamped = Math.min(item.max, Math.max(item.min, v));
        out.value = String(clamped);
        inp.value = String(clamped);
        setValue(item.key, clamped);
      };
      out.addEventListener('change', commit);
      out.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          commit();
          out.blur();
        }
      });
      // Typing must not be hijacked by the label wrapper or the canvas.
      out.addEventListener('click', (e) => e.stopPropagation());
      const unit = item.unit ? el('span', { class: 'unit' }, item.unit) : null;
      const head = el('span', { class: 'valwrap' });
      head.append(out);
      if (unit) head.append(unit);
      row.append(el('span', { class: 'lab' }, item.label), head);
      row.append(inp);
      row.classList.add('stack');
    }
    rail.append(row);
  }
}

function holeNodes(holes, opacity) {
  const g = el('g', { fill: state.holeColor || '#0e0f11', opacity });
  for (const h of holes) {
    const d = svgPath(h);
    g.append(d ? el('path', { d }) : el('circle', { cx: h.cx, cy: h.cy, r: h.r }));
  }
  return g;
}

let current = null;

let lastRailSig = null;

function render() {
  // Rebuild the rail ONLY when the set of visible controls changes. Otherwise
  // the element under the pointer would be swapped out mid-gesture.
  const sig = railSignature();
  if (sig !== lastRailSig) {
    lastRailSig = sig;
    buildRail();
  } else {
    syncRail();
  }
  const field = buildField(state);
  current = field;
  const ghost = state.showGhost ? buildField({ ...state, cols: state.cols + 1 }) : null;
  const ghostHoles = ghost ? ghost.holes.filter((h) => h.panelCol === state.cols) : [];
  const ghostPanel = ghost ? ghost.panels.find((p) => p.col === state.cols && p.row === 0) : null;

  const pad = 60;
  const w = field.fieldW + (ghost ? PANEL.moduleW + state.gap : 0) + pad * 2;
  const h = field.fieldH + pad * 2;
  const svg = el('svg', {
    viewBox: `${-pad} ${-pad} ${w} ${h}`,
    preserveAspectRatio: 'xMidYMid meet',
  });

  // Panel face, painted first so holes and frames sit on top of it. Drawn per
  // panel rather than as one field rect, so the joints stay visible when the
  // face colour is close to the page background.
  for (const pn of field.panels) {
    svg.append(
      el('rect', {
        x: pn.x,
        y: pn.y,
        width: PANEL.moduleW,
        height: PANEL.moduleH,
        fill: state.panelColor || '#eceff3',
      })
    );
  }

  if (state.showFrames) {
    for (const pn of field.panels) {
      svg.append(
        el('rect', {
          x: pn.x - (PANEL.moduleW - PANEL.faceW) / 2,
          y: pn.y - (PANEL.moduleH - PANEL.faceH) / 2,
          width: PANEL.moduleW,
          height: PANEL.moduleH,
          fill: 'none',
          stroke: 'rgba(0,0,0,.18)',
          'stroke-width': 2,
        }),
        el(
          'text',
          {
            x: pn.x + pn.w / 2,
            y: pn.y + pn.h - 16,
            'text-anchor': 'middle',
            'font-size': 42,
            fill: 'rgba(0,0,0,.2)',
          },
          pn.label
        )
      );
    }
  }
  if (state.showSeams) {
    // Every internal joint. Drawn behind the holes deliberately: on top, the
    // line covers the very column of holes centred on the joint, which makes a
    // continuous pattern look like it breaks at each panel edge.
    const step = PANEL.moduleW + state.gap;
    const stepY = PANEL.moduleH + state.gap;
    const seam = { stroke: '#c0392b', 'stroke-width': 6, opacity: 0.5 };
    for (let c = 1; c < state.cols; c++) {
      svg.append(
        el('line', { x1: c * step, y1: 0, x2: c * step, y2: field.fieldH, ...seam })
      );
    }
    for (let r = 1; r < state.rows; r++) {
      svg.append(
        el('line', { x1: 0, y1: r * stepY, x2: field.fieldW, y2: r * stepY, ...seam })
      );
    }
  }
  svg.append(holeNodes(field.holes, 1));

  if (ghostPanel) {
    svg.append(
      el('rect', {
        x: ghostPanel.x - (PANEL.moduleW - PANEL.faceW) / 2,
        y: ghostPanel.y - (PANEL.moduleH - PANEL.faceH) / 2,
        width: PANEL.moduleW,
        height: PANEL.moduleH,
        fill: 'none',
        stroke: 'rgba(0,0,0,.2)',
        'stroke-width': 2,
        'stroke-dasharray': '16 12',
      }),
      holeNodes(ghostHoles, 0.22),
      el(
        'text',
        {
          x: ghostPanel.x + ghostPanel.w / 2,
          y: ghostPanel.y + ghostPanel.h / 2,
          'text-anchor': 'middle',
          'font-size': 34,
          fill: 'rgba(0,0,0,.32)',
        },
        'continues'
      )
    );
  }

  const stage = document.getElementById('stage');

  // ZOOM ABOUT THE CENTRE OF THE WINDOW.
  //
  // Record which point of the drawing is currently at the middle of the
  // viewport, as a fraction of the scrollable content. After resizing the SVG
  // we scroll so that same point is at the middle again. Without this the
  // content is anchored top-left and appears to slide away as you zoom.
  const prevW = stage.scrollWidth || 1;
  const prevH = stage.scrollHeight || 1;
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / prevW;
  const fy = (stage.scrollTop + stage.clientHeight / 2) / prevH;
  const hadContent = stage.childElementCount > 0;

  // Size the SVG in real pixels and let the stage scroll. The viewBox is
  // untouched, so geometry and hit-testing are unaffected.
  const avail = Math.max(120, stage.clientWidth - 40);
  const fitScale = avail / w;
  const px = w * fitScale * (state.zoom / 100);
  svg.setAttribute('width', String(Math.max(80, px)));
  svg.setAttribute('height', String(Math.max(80, (px * h) / w)));
  svg.removeAttribute('preserveAspectRatio');
  stage.textContent = '';
  stage.append(svg);

  const recentre = () => {
    const cx = fx * stage.scrollWidth - stage.clientWidth / 2;
    const cy = fy * stage.scrollHeight - stage.clientHeight / 2;
    stage.scrollLeft = hadContent ? Math.max(0, cx) : (stage.scrollWidth - stage.clientWidth) / 2;
    stage.scrollTop = hadContent ? Math.max(0, cy) : (stage.scrollHeight - stage.clientHeight) / 2;
  };
  recentre();

  const s = field.stats;
  document.getElementById('meta').textContent =
    `${state.cols} x ${state.rows} panels  ${field.fieldW} x ${field.fieldH} mm`;
  document.getElementById('stats').textContent =
    `${s.placed.toLocaleString()} holes   ${s.openPct.toFixed(1)}% open   ` +
    `dia ${s.holeMinDia.toFixed(1)}-${s.holeMaxDia.toFixed(1)}mm   ` +
    `removed ${s.culled}   dropped ${s.dropped}   ` +
    `${Math.round(s.placed / (state.cols * state.rows))}/panel   ` +
    `tile ${state.tiling}   pitch ${resolvePitch(state).pitch.toFixed(1)}mm (target ${state.pitch})`;
  // Boundary report. This is the difference between "the seams look right" and
  // "any tile can go anywhere", which is what makes the set manufacturable as
  // a small kit of parts rather than a fixed sequence.
  // Two separate properties, and conflating them is what hid a real bug: edges
  // can match perfectly while the pattern still restarts mid-cycle at the joint.
  const cont = document.getElementById('cont');
  if (cont) {
    const ok = s.patternContinuous;
    cont.className = ok ? 'edge ok' : 'edge warn';
    cont.textContent = ok
      ? 'Pattern continues across every joint - the design repeats exactly on the 600 x 1200 module.'
      : 'Pattern BREAKS at each joint: this driver does not repeat on the 600 x 1200 module, so it restarts mid-cycle at every panel edge. For a diagonal, use the lattice or chevron driver - its cycle counts are whole numbers, so it always meets itself. For wave, pick a wavelength that divides the projected module (at 45 degrees: 424.3, 212.1, 141.4 ...).';
  }

  // ALIASING. Separate from the continuity banner above on purpose: that one
  // asks whether the design repeats on the module, this one asks whether the
  // lattice is fine enough to SHOW the driver it is carrying. A pattern can
  // tile perfectly and still collapse, which is what makes this its own check.
  const alias = document.getElementById('alias');
  if (alias) {
    const issues = aliasAudit(state, s);
    alias.textContent = '';
    if (!issues.length) {
      alias.className = 'edge ok';
      alias.textContent =
        state.modulation === 'uniform'
          ? 'Uniform driver - no pattern to alias.'
          : `Lattice resolves ${s.driverLevels} distinct levels from the driver, largest group ${(
              100 * s.driverTieMax
            ).toFixed(0)}% of holes.` +
            (s.cullRequested
              ? ` Removal asked for ${s.cullRequested.toFixed(0)}% and landed on ${s.cullAchieved.toFixed(
                  0
                )}%.`
              : '') +
            ' Enough for the pattern to read.';
    } else {
      alias.className = 'edge warn';
      alias.append(
        document.createTextNode(
          `Pattern is ALIASING - it still tiles, but the lattice only resolves ${s.driverLevels} ` +
            `levels and ${(100 * s.driverTieMax).toFixed(0)}% of holes share one of them, so the ` +
            `shape cannot come through and a removal threshold moves them all at once. ` +
            issues.map((i) => i.note).join(' ') + ' '
        )
      );
      const btn = el('button', { class: 'fix' }, 'fix');
      btn.addEventListener('click', () => {
        const patch = aliasFix(state);
        if (!patch) {
          alias.append(
            document.createTextNode(' No nearby setting clears it - try a finer pitch or another driver.')
          );
          return;
        }
        // Working state only. persist() writes the saved-design LIBRARY, which
        // has nothing to do with the value being repaired here.
        Object.assign(state, patch);
        render();
      });
      alias.append(btn);
    }
  }

  const edge = document.getElementById('edge');
  if (edge) {
    const ok = s.tilesInterchangeable;
    // A TRANSITION IS MEANT TO HAVE TWO DIFFERENT EDGES.
    //
    // The ramp starts at one diameter and ends at another, so of course its two
    // edges differ - that is the panel's entire purpose. Telling someone to
    // pick a different driver here would be telling them to stop building the
    // thing they are building.
    const ramp = state.modulation === 'ramp';
    edge.className = ok || ramp ? 'edge ok' : 'edge warn';
    edge.textContent = ramp
      ? 'Transition panel: the two ends are DIFFERENT by design, so it does not tile with itself. It goes once between the two standard panels whose sizes it runs between - check those edges match, not this one.'
      : ok
      ? 'Boundaries identical - every joint carries the same edge, so tiles can be laid in any order (AB, BA, AABB ...).'
      : 'Boundaries alternate - each joint matches its own two sides, so the field is continuous, but ' +
        (s.edgeMatchX ? '' : 'the left and right panel edges differ') +
        (!s.edgeMatchX && !s.edgeMatchY ? ' and ' : '') +
        (s.edgeMatchY ? '' : 'the top and bottom panel edges differ') +
        '. Tiles are not interchangeable: AB works, AA does not. Use a driver that completes whole cycles across a panel (e.g. wave with wavelength 600 or 300), or uniform.';
  }
  const warn = document.getElementById('warn');
  if (!s.placed) {
    warn.style.display = 'block';
    warn.textContent =
      `Nothing is cut: all ${s.dropped} candidates fall under the ${LIMITS.minPerfArea}mm2 minimum ` +
      `perforation area. There is no edge keep-out - holes may straddle a joint.`;
  } else if (s.diaShort && state.minDia !== state.maxDia) {
    // The design states a size range; the field did not deliver it. Usually a
    // ramp spanning further than the panel, or a driver that never reaches its
    // own extreme.
    warn.style.display = 'block';
    warn.textContent =
      `Cut ${s.diaLow}-${s.diaHigh}mm, not the ${s.diaWant[0]}-${s.diaWant[1]}mm asked for. ` +
      `A ramp whose span is longer than the panel only gets part way (check span mm against the ` +
      `panel, or use 'across the run'); noise and radial drivers reach their extremes only where ` +
      `the field happens to peak. On a transition panel the end sizes are the specification.`;
  } else if (s.diaClamped) {
    // The size asked for was not the size delivered. On a transition panel
    // that is the whole specification, so it cannot be left to be noticed.
    warn.style.display = 'block';
    warn.textContent =
      `Max dia ${s.diaAsked}mm does not fit this lattice: it can carry ${s.diaCap}mm, so the ` +
      `largest holes were cut to that. Widen the pitch (or the row spacing) if the ${s.diaAsked}mm ` +
      `end has to be exact - a transition panel that does not reach its end diameter will not ` +
      `match the panel it butts against.`;
  } else {
    warn.style.display = 'none';
  }
}

    'How many of the three coarse lattices are drawn. Each is a triangular lattice of three times the side - nine small triangles - and the three of them divide every small edge between them, one owner each. Drawing fewer than three leaves whole families of edges empty.',
  asaKeep:
    'The chance an edge keeps its dash. This is the density control.',
  kitCols:
    'How many panels across the field repeats over, with the driver scope set to kit. Eight panels of a 4 x 2 kit tile any length of wall.',
  kitRows:
    'How many panels down the field repeats over.',
  lineGap:
    'Metal kept clear at both ends of every grid line, before any dash starts. This is what keeps the three lines meeting at a node from running into each other - the reservation is made first and the dash is cut to whatever span is left, so no combination of length and slide can eat into it. Raising it shortens every dash.',
  lineShift:
    'Slides one of the three line families along its own direction, as a percentage of the dash length - vertical under the hexV lattice. At 50% the ends of the three families meet instead of sitting mid-edge, which closes them into triangles. This one is allowed past the reserved end gap, so watch the clearance readout when you raise it.',
  lineStagger:
    'Slides the two diagonal families along their own lines, as a percentage of the edge. At 0 all three sit at their edge midpoints. Moving them puts the diagonals against the triangle centres while the verticals stay on the edges, so the two axes read as different things rather than as one uniform mesh.',
  linePairChance:
    'How often an edge carries a second dash of the same direction beside the first. Without it the closest same-direction neighbour is a whole lattice period away; the reference has one at 0.94 of a dash length, so some edges must be doubled.',
  linePairDist: 'How far the partner sits, as a percentage of the dash length. 94 is the measured value.',
  linePairAngle:
    'Which way the partner is offset, measured from the dash axis. 0 would put it end to end, 90 straight beside; 23 is the measured value, so it steps along and sideways at once.',
  lineFloat:
    'How far each dash may slide along its own line, as a percentage of the edge it sits on. 0 pins every dash to the midpoint, which reads as a rigid grid. Raising it keeps every dash ON the line - a straight edge still runs dash to dash - while removing the translational regularity, which is what a hand-stitched panel looks like.',
  lineSeed: 'Reshuffles the slides. Same seed, same panel.',
  stampCount:
    'How many holes each lattice node carries. 1 is the ordinary field. 3 turns every node into a group of three parallel holes, which is what makes a woven or stitched motif rather than a field of separate marks.',
  stampGap:
    'Centre-to-centre spacing inside a group, across the holes rather than along them. Raised automatically if it would leave less than the minimum web between two members - the group is never allowed to overlap itself.',
  shapeAngleSeed: 'Reshuffles which direction each node draws. Same seed, same pattern.',
  stampVary:
    'Chance that each hole beyond the first is actually there. 0 makes every group the full size; raising it mixes singles, pairs and triples, with singles most common. Around 35% matches a hand-stitched look.',
  radialShape:
    'What figure "distance from the centre" draws. 1 is a straight-sided DIAMOND, and below 1 its sides bow INWARD - the two points still meet at a corner, joined by a curve, which is the playing-card diamond. 2 is the circle this has always drawn, and higher values head toward a rectangle. Point it at the tiling unit rather than the panel and the figure is assembled out of four panels rather than repeated on each one.',
  shapeCurve:
    'How the two sides between the tips bend. 1 is straight - a plain rhombus. Below 1 they pinch inward and it reads as a playing-card diamond; above 1 they bow out, reaching an ellipse at 2. The two end points stay sharp at every setting. Bowing out costs hole size: at 2 the shape is a circle, which on a square grid has to be root 2 smaller than the rhombus to keep the same web.',
  curveMax:
    'Lets the gradient bend the sides as it crosses the field, running from the setting above to this one. 0 leaves the curve the same everywhere.',
  ratioMax:
    'Hands the driver the shape PROPORTION instead of the hole size. The ratio runs from the one above, at the low end of the field, to this at the high end. Set min dia = max dia alongside it and the gradient stops changing how big the holes are and changes what shape they are - a rhombus shearing from a square on its corner down to a sliver, its long diagonal never moving. 0 turns it off.',
  slotRatio:
    'How long a slot is against its width. The length is always the hole size; raising this narrows it. Around 6:1 and up it stops reading as a lozenge and starts reading as a dash or a stitch.',
  shapeAngleMode:
    'Which way each hole points. This is a RULE, not jitter - the angle comes from the lattice index or the position, so the same node always gets the same angle and the pattern still repeats on the module. ALL THE SAME is one angle everywhere. ALTERNATING flips 90 degrees on a checker. WOVEN steps through three angles 60 degrees apart, which is what turns slots into a hemp-leaf weave on a triangular lattice. RADIATING points each hole away from the nearest motif centre, giving rosettes; AROUND is the same field turned 90 degrees, giving rings.',
